[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "romcloud"
version = "0.9.32"
description = "Browse and launch ROMs stored on remote/external sources from Batocera"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["batocera", "emulation", "roms", "retrogaming"]
dependencies = [
    "click>=8.1",
    "cryptography>=41",
    "paramiko>=3.4",
]

[project.optional-dependencies]
smb = [
    "smbprotocol>=1.13",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
romcloud = "romcloud.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
romcloud = ["web/static/*.html", "web/static/*.css", "web/static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--tb=short"]

[tool.coverage.run]
source = ["romcloud"]

[tool.coverage.report]
show_missing = true
