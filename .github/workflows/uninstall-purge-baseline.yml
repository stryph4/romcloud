name: Uninstall Purge Baseline Classification

on:
  push:
    branches:
      - ci/uninstall-purge-baseline-20260917

jobs:
  classify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: first-wip
            ref: cad2fc9a7a15f482a2bf1547d18969e115c043f0
          - label: develop-base
            ref: 47b80cc11a88a7adcc5ef4b94a97fb1c5c86d194
    name: Full baseline ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -U pip && python -m pip install -e '.[dev,smb]'
      - name: Full Python suite
        run: python -m pytest -q
